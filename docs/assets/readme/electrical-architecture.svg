<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#54d7c6"/></marker>
  <style>
    .t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#eef7f8}
    .h1{font-size:42px;font-weight:700}.h2{font-size:25px;font-weight:700}.b{font-size:21px}.s{font-size:18px;fill:#b7cdd2}
    .box{fill:#132f38;stroke:#28545c;stroke-width:2;rx:16}.hot{fill:#352824;stroke:#91623c;stroke-width:2;rx:16}
    .groupHot{fill:#2a211e;stroke:#9b6a3e;stroke-width:2;rx:18}.groupSafe{fill:#0f2b33;stroke:#2f7375;stroke-width:2;rx:18}
    .line{stroke:#54d7c6;stroke-width:4;fill:none;marker-end:url(#a)}.hotline{stroke:#ffb75f;stroke-width:4;fill:none;marker-end:url(#a)}
  </style>
</defs>
<rect width="1800" height="1180" fill="#0b1b23"/>
<text x="60" y="72" class="t h1">CARBENTRA Plug · Rev B Electrical Architecture</text>
<text x="60" y="115" class="t b" fill="#ffbe6b">220 VAC / 16 A-class design target · 4-layer PCB · isolated metering · local protection · verified actuation feedback</text>

<rect x="45" y="155" width="800" height="680" class="groupHot"/>
<rect x="885" y="155" width="870" height="680" class="groupSafe"/>
<text x="75" y="202" class="t h2" fill="#ffc27a">Mains &amp; power path</text>
<text x="915" y="202" class="t h2" fill="#68e0ce">Isolated control &amp; sensing domain</text>

<rect x="80" y="235" width="330" height="150" class="hot"/>
<text x="105" y="278" class="t h2">Input &amp; primary protection</text>
<text x="105" y="316" class="t b">Fixed L / N / PE polarity</text>
<text x="105" y="348" class="t b">Main fuse + thermal protection</text>

<rect x="475" y="235" width="330" height="150" class="hot"/>
<text x="500" y="278" class="t h2">Controlled switching</text>
<text x="500" y="316" class="t b">K1 power relay</text>
<text x="500" y="348" class="t b">Local permission chain gates actuation</text>
<path d="M410 310 H475" class="hotline"/>

<rect x="80" y="455" width="330" height="210" class="hot"/>
<text x="105" y="498" class="t h2">Energy metering</text>
<text x="105" y="536" class="t b">ATM90E26 metering IC</text>
<text x="105" y="568" class="t b">1 mΩ four-terminal shunt</text>
<text x="105" y="600" class="t b">Voltage sampling + 8.192 MHz clock</text>
<text x="105" y="632" class="t b">Per-device calibration in NVS</text>

<rect x="475" y="465" width="330" height="190" class="hot"/>
<text x="500" y="508" class="t h2">Metering isolation</text>
<text x="500" y="546" class="t b">ISO6741 isolated SPI</text>
<text x="500" y="578" class="t b">R05CT isolated supply</text>
<text x="500" y="610" class="t b">HOT_GND separated from logic GND</text>
<path d="M410 555 H475" class="line"/>

<rect x="925" y="235" width="360" height="185" class="box"/>
<text x="950" y="278" class="t h2">ESP32-C3 controller</text>
<text x="950" y="316" class="t b">Wi-Fi / BLE · policy execution</text>
<text x="950" y="348" class="t b">Local button · status indication</text>
<text x="950" y="380" class="t b">External antenna interface</text>

<rect x="1340" y="235" width="370" height="185" class="box"/>
<text x="1365" y="278" class="t h2">Local sensing &amp; drive</text>
<text x="1365" y="316" class="t b">TMP102 board temperature</text>
<text x="1365" y="348" class="t b">Relay coil drive + flyback</text>
<text x="1365" y="380" class="t b">Local button / LED</text>
<path d="M1285 325 H1340" class="line"/>

<rect x="925" y="495" width="360" height="165" class="box"/>
<text x="950" y="538" class="t h2">Output-state feedback</text>
<text x="950" y="576" class="t b">ACPL-K376 AC-presence detection</text>
<text x="950" y="608" class="t b">Requested vs measured state</text>

<rect x="1340" y="475" width="370" height="205" class="box"/>
<text x="1365" y="518" class="t h2">Independent thermal permission</text>
<text x="1365" y="556" class="t b">Remote TMP302 threshold sensor</text>
<text x="1365" y="588" class="t b">Supervisor + latch</text>
<text x="1365" y="620" class="t b">Hardware coil-supply gate</text>
<text x="1365" y="652" class="t b">Local physical rearm</text>

<path d="M805 555 H925" class="line"/><path d="M1105 495 V420" class="line"/><path d="M1340 575 H1285" class="line"/>

<rect x="925" y="710" width="360" height="100" class="box"/>
<text x="950" y="752" class="t h2">Low-voltage supply</text>
<text x="950" y="786" class="t b">IRM-10-5 → 5 V · AP63203 → 3.3 V</text>
<path d="M1105 710 V660" class="line"/>

<text x="80" y="785" class="t b" fill="#ffd29a">PE remains continuous and independent; it is never switched or bonded to control ground.</text>

<rect x="55" y="885" width="510" height="210" class="box"/>
<text x="82" y="930" class="t h2">Device</text>
<text x="82" y="970" class="t b">Measure real state · execute locally permitted actions</text>
<text x="82" y="1005" class="t b">Fault latch · offline hold · physical feedback</text>
<text x="82" y="1040" class="t b">Remote policy stays inside local limits</text>

<rect x="645" y="885" width="510" height="210" class="box"/>
<text x="672" y="930" class="t h2">Edge</text>
<text x="672" y="970" class="t b">Aggregation · durable storage · policy filtering</text>
<text x="672" y="1005" class="t b">Local coordination · timeout · offline continuity</text>
<text x="672" y="1040" class="t b">Durable receipts close the data loop</text>

<rect x="1235" y="885" width="510" height="210" class="box"/>
<text x="1262" y="930" class="t h2">Cloud</text>
<text x="1262" y="970" class="t b">Load forecast · carbon-aware optimization · dispatch</text>
<text x="1262" y="1005" class="t b">Bounded policies and configuration</text>
<text x="1262" y="1040" class="t b">Never changes physical current ratings</text>

<text x="60" y="1140" class="t s">Rev B digital engineering architecture. Physical rating, temperature rise, insulation, EMC and protection coordination remain EVT validation items.</text>
</svg>